<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>California Fog Wave Chaser</title>
<!-- Optional: used only to draw A2UI Icon components. If it can't load (offline/
     corp network), icons fall back to showing their name as text. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined">
<!-- Lightweight Markdown Parser -->
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<!-- Leaflet Map CSS & JS -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<style>
  :root { 
    --accent: #2b5876;
    --accent-gradient: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
    --bg-overlay: rgba(15, 23, 42, 0.45);
    --card-bg: rgba(255, 255, 255, 0.92);
    --border: rgba(255, 255, 255, 0.3);
  }
  * { box-sizing:border-box; }
  body { 
    margin: 0; 
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: 
      linear-gradient(rgba(15, 23, 42, 0.45), rgba(15, 23, 42, 0.55)),
      url("https://shainblumphoto.com/wp-content/uploads/2017/12/san_francisco_photography_fog_cityscape_32.jpg") no-repeat center center fixed;
    background-size: cover;
    display: flex; 
    flex-direction: column; 
    height: 100vh; 
    overflow: hidden;
  }
  header { 
    background: rgba(15, 23, 42, 0.85); 
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    color: #fff; 
    padding: 0.9rem 1.4rem; 
    font-weight: 700; 
    font-size: 1.15rem;

    border-bottom: 1px solid rgba(255, 255, 255, 0.15);

  }
  .header-left {
    display: flex;
    align-items: center;
    gap: 0.6rem;
  }
  .header-btn {
    display: flex;
    align-items: center;
    gap: 0.4rem;
    background: rgba(255, 255, 255, 0.15);
    color: #fff;
    border: 1px solid rgba(255, 255, 255, 0.25);
    padding: 0.45rem 0.9rem;
    border-radius: 20px;
    font-size: 0.88rem;
    font-weight: 500;
    cursor: pointer;
    backdrop-filter: blur(8px);
    transition: all 0.2s;
  }
  .header-btn:hover {
    background: rgba(255, 255, 255, 0.25);
    transform: translateY(-1px);
  }
  #log { flex:1; overflow-y:auto; padding:1.4rem; max-width:820px; width:100%; margin:0 auto; }
  .msg { margin:0.8rem 0; }
  .msg.user { text-align:right; }
  .bubble { 
    display: inline-block; 
    padding: 0.85rem 1.2rem; 
    border-radius: 16px; 
    background: var(--card-bg); 
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border: 1px solid var(--border); 
    text-align: left; 
    max-width: 88%; 
    line-height: 1.55; 
    color: #1e293b; 
    box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.25);
  }
  .msg.user .bubble { 
    background: linear-gradient(135deg, #e0f2fe 0%, #bae6fd 100%); 
    color: #0c4a6e; 
    border: 1px solid rgba(255, 255, 255, 0.6); 
    white-space: pre-wrap; 
    box-shadow: 0 4px 16px rgba(12, 74, 110, 0.15);
    font-weight: 500;
  }
  /* Rendered markdown formatting */
  .bubble.markdown-body h1, .bubble.markdown-body h2, .bubble.markdown-body h3 { margin:0.8rem 0 0.4rem; color:#0f172a; }
  .bubble.markdown-body h1 { font-size:1.4rem; }
  .bubble.markdown-body h2 { font-size:1.2rem; }
  .bubble.markdown-body h3 { font-size:1.05rem; }
  .bubble.markdown-body p { margin:0.4rem 0; }
  .bubble.markdown-body ul, .bubble.markdown-body ol { margin:0.4rem 0; padding-left:1.4rem; }
  .bubble.markdown-body li { margin:0.25rem 0; }
  .bubble.markdown-body hr { border:none; border-top:1px solid rgba(0,0,0,0.1); margin:0.8rem 0; }
  .bubble.markdown-body code { background:rgba(0,0,0,0.06); padding:0.2rem 0.4rem; border-radius:4px; font-size:0.9em; font-family:monospace; }
  /* When the reply is an A2UI card, drop the bubble chrome so the card stands alone. */
  .bubble.rich { background:transparent; border:none; padding:0; max-width:100%; white-space:normal; box-shadow:none; }
  .chips-container {
    display: flex;
    gap: 0.5rem;
    padding: 0.5rem 1.4rem;
    overflow-x: auto;
    max-width: 860px;
    margin: 0 auto;

  }
  .chips-container::-webkit-scrollbar { display: none; }
  .chip {
    white-space: nowrap;
    background: rgba(255, 255, 255, 0.82);

  form { 
    display: flex; 
    gap: 0.6rem;

    background: rgba(15, 23, 42, 0.85);

  input {

  button {

  /* --- A2UI component styles (Card, Column, Row, Text, Divider, List, Image, Icon) --- */
  .a2card { 
    border: 1px solid var(--border); 
    border-radius: 16px; 
    padding: 1.25rem; 
    background: var(--card-bg);

  .a2card + .a2card, .a2col > .a2card { margin-top:0.6rem; }
  .a2col { display:flex; flex-direction:column; gap:0.45rem; }
  .a2row { display:flex; flex-direction:row; gap:0.6rem; align-items:center; flex-wrap:wrap; }
  .a2row.between { justify-content:space-between; }
  .a2text { margin:0; line-height:1.45; color:#1e293b; }
  .a2text.a2-h1 { font-size:1.55rem; font-weight:700; color:#0f172a; }
  .a2text.a2-h2 { font-size:1.3rem; font-weight:700; color:#0f172a; }

  /* --- Visual Fog Wave Gauge / Progress Bar --- */

    margin: 0.6rem 0 0.8rem;

    padding: 0.75rem 1rem;
    border-radius: 12px;
    border: 1px solid rgba(0, 0, 0, 0.06);

  .fog-gauge-header {

    align-items: center;

  .gauge-moderate { background: linear-gradient(90deg, #f59e0b, #d97706); }
  .gauge-low { background: linear-gradient(90deg, #94a3b8, #64748b); }

  /* --- Interactive Map Drawer --- */
  .map-drawer-overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    background: rgba(15, 23, 42, 0.6);

  }
  .map-drawer-overlay.open {

  .map-drawer {
    position: fixed;
    top: 0;

    background: #ffffff;

  .map-drawer.open {

  .map-drawer-header {

<body>
<header>
  <div class="header-left">
    <span class="material-symbols-outlined" style="font-size:1.5rem; color:#93c5fd;">foggy</span>
    <span>California Fog Wave Chaser</span>
  </div>
  <button type="button" class="header-btn" onclick="openMapDrawer()">
    <span class="material-symbols-outlined" style="font-size:1.2rem; color:#93c5fd;">map</span>
    Viewpoints Map
  </button>
</header>
<div id="log"></div>

<!-- Interactive Map Drawer -->
<div class="map-drawer-overlay" id="drawerOverlay" onclick="closeMapDrawer()"></div>
<div class="map-drawer" id="mapDrawer">
  <div class="map-drawer-header">
    <div class="map-drawer-title">
      <span class="material-symbols-outlined" style="color:#60a5fa;">pin_drop</span>
      Fog Photography Viewpoints
    </div>
    <button type="button" class="close-drawer-btn" onclick="closeMapDrawer()">✕</button>
  </div>
  <div id="map"></div>
  <div class="map-viewpoint-list" id="viewpointList">
    <div style="text-align:center; padding:2rem; color:#64748b;">Loading viewpoints…</div>
  </div>
</div>

<div class="chips-container">
  <button type="button" class="chip" onclick="quickAsk('Will there be fog waves at Mt Tamalpais tonight?')">🌊 Mt Tam Waves</button>
  <button type="button" class="chip" onclick="quickAsk('What is the status of fog waves at Hawk Hill?')">🌁 Hawk Hill Fog</button>
  <button type="button" class="chip" onclick="quickAsk('List top California fog photography viewpoints')">📍 Top Viewpoints</button>
</div>

<form id="form">
  <input id="input" placeholder="Ask about fog waves, Mt Tamalpais, Hawk Hill, or sunset times…" autocomplete="off" autofocus>
  <button>Send</button>
</form>

<script>
const log = document.getElementById("log");
const form = document.getElementById("form");
const input = document.getElementById("input");

function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }

function bubble(who) {
  const m = el("div", "msg " + who);
  const b = el("div", "bubble");
  m.appendChild(b); log.appendChild(m); log.scrollTop = log.scrollHeight;
  return b;
}

/* ----------------------------------------------------------------------------
 * A2UI mini-renderer (v0.8 Basic Catalog subset).
 * Renders Card / Column / Row / Text / Divider / List / Image / Icon.
 * Anything else falls back to plain text (see renderReply). All text goes in via
 * textContent and image URLs are validated, so agent output can't inject HTML.
 * -------------------------------------------------------------------------- */

// A "bound value" is usually {literalString: "..."}; we only support literals.
function boundStr(v) {
  if (v == null) return "";
  if (typeof v === "string") return v;
  if (typeof v.literalString === "string") return v.literalString;
  return "";
}

// child ids of a component's props: single `child` and/or `children.explicitList`.
function childIds(props) {
  const ids = [];
  if (props && typeof props.child === "string") ids.push(props.child);
  const ch = props && props.children;
  if (ch && Array.isArray(ch.explicitList)) for (const c of ch.explicitList) if (typeof c === "string") ids.push(c);
  return ids;
}

// A2UI icon names are camelCase (locationOn); Material Symbols wants snake_case.
function iconName(n) { return String(n || "").replace(/([a-z0-9])([A-Z])/g, "$1_$2").replace(/\s+/g, "_").toLowerCase(); }

function buildNode(id, comps, seen) {
  if (!id || seen.has(id)) return null;   // missing / cycle guard
  seen.add(id);
  const spec = comps[id];
  if (!spec || typeof spec !== "object") return null;
  const type = Object.keys(spec)[0];
  const props = spec[type] || {};
  const kids = () => childIds(props).map(cid => buildNode(cid, comps, seen)).filter(Boolean);

  switch (type) {
    case "Card": {
      const d = el("div", "a2card"); kids().forEach(n => d.appendChild(n)); return d;
    }
    case "Column":
    case "List": {
      const horizontal = type === "List" && props.direction === "horizontal";
      const d = el("div", horizontal ? "a2row" : "a2col"); kids().forEach(n => d.appendChild(n)); return d;
    }
    case "Row": {
      const d = el("div", "a2row" + (props.distribution === "spaceBetween" ? " between" : ""));
      kids().forEach(n => d.appendChild(n)); return d;
    }
    case "Text": {
      const t = el("div", "a2text");
      const hint = String(props.usageHint || "body").toLowerCase();
      if (["h1", "h2", "h3", "h4", "h5", "h6"].includes(hint)) t.classList.add("a2-" + hint);
      else if (hint === "caption") t.classList.add("a2-caption");
      const rawText = boundStr(props.text);
      t.textContent = rawText;

      // Check for fog score or chance of fog waves (e.g. "Chance of Fog Waves: 25%" or "Fog Wave Score: 85%")
      const match = rawText.match(/(?:Chance of Fog Waves|Fog Wave Score|Change of Fog Waves)[^\d]*(\d{1,3})%/i);
      if (match) {
        const score = Math.min(100, Math.max(0, parseInt(match[1], 10)));
        let gaugeClass = "gauge-low";
        let label = "Low Probability";
        let badgeColor = "#64748b";
        if (score >= 80) { gaugeClass = "gauge-epic"; label = "Epic Waves"; badgeColor = "#059669"; }
        else if (score >= 60) { gaugeClass = "gauge-good"; label = "Good Action"; badgeColor = "#2563eb"; }
        else if (score >= 40) { gaugeClass = "gauge-moderate"; label = "Moderate / Variable"; badgeColor = "#d97706"; }

        const gauge = el("div", "fog-gauge-container");
        gauge.innerHTML = `
          <div class="fog-gauge-header">
            <span class="fog-gauge-title">
              <span class="material-symbols-outlined" style="font-size:1.15rem; color:#2563eb;">waves</span>
              Fog Wave Probability Index
            </span>
            <span class="fog-gauge-badge" style="background:${badgeColor}">${score}% — ${label}</span>
          </div>
          <div class="fog-gauge-track">
            <div class="fog-gauge-fill ${gaugeClass}" style="width:0%"></div>
          </div>
        `;
        setTimeout(() => {
          const fill = gauge.querySelector(".fog-gauge-fill");
          if (fill) fill.style.width = score + "%";
        }, 100);

        const wrapper = el("div", "text-with-gauge");
        wrapper.appendChild(t);
        wrapper.appendChild(gauge);
        return wrapper;
      }

      return t;
    }
    case "Divider":
      return el("hr", "a2divider");
    case "Image": {
      const src = boundStr(props.url || props.src);
      if (!/^https?:\/\//i.test(src)) return null;   // only allow safe URLs
      const img = el("img", "a2img"); img.src = src; img.alt = boundStr(props.alt) || ""; return img;
    }
    case "Icon": {
      const s = el("span", "material-symbols-outlined"); s.textContent = iconName(boundStr(props.name) || props.name); return s;
    }
    default:
      return null;   // unknown component -> skipped (text fallback covers content)
  }
}

// Render one or more A2UI messages (beginRendering + surfaceUpdate) into `container`.
// Returns true if anything was drawn.
function renderSurface(messages, container) {
  const comps = {};
  const roots = [];
  for (const m of messages) {
    if (m.beginRendering && typeof m.beginRendering.root === "string") roots.push(m.beginRendering.root);
    const su = m.surfaceUpdate;
    if (su && Array.isArray(su.components)) for (const c of su.components) if (c && c.id && c.component) comps[c.id] = c.component;
  }
  let rootIds = roots.filter(r => comps[r]);
  if (rootIds.length === 0) {   // no valid root given -> infer un-referenced components
    const referenced = new Set();
    for (const id in comps) { const spec = comps[id]; childIds(spec[Object.keys(spec)[0]] || {}).forEach(c => referenced.add(c)); }
    rootIds = Object.keys(comps).filter(id => !referenced.has(id));
  }
  let drew = false;
  for (const rid of rootIds) { const node = buildNode(rid, comps, new Set()); if (node) { container.appendChild(node); drew = true; } }
  return drew;
}

// Fallback: pull every Text value out of the messages as plain text.
function flattenText(messages) {
  const out = [];
  for (const m of messages) {
    const su = m.surfaceUpdate;
    if (su && Array.isArray(su.components)) for (const c of su.components) if (c && c.component && c.component.Text) out.push(boundStr(c.component.Text.text));
  }
  return out.join("\n").trim();
}

function renderReply(b, parts) {
  b.textContent = "";   // clear the "…" placeholder
  const texts = parts.filter(p => p && (p.kind === "text" || (!p.kind && p.text))).map(p => p.text || "");
  const a2ui = parts.filter(p => p && p.kind === "a2ui" && p.data).map(p => p.data);

  const textStr = texts.join("\n").trim();
  if (textStr) {
    const textNode = el("div", null);
    if (typeof marked !== "undefined" && marked.parse) {
      b.classList.add("markdown-body");
      textNode.innerHTML = marked.parse(textStr);
    } else {
      textNode.textContent = textStr;
    }
    b.appendChild(textNode);
  }

  if (a2ui.length) {
    b.classList.add("rich");
    if (!renderSurface(a2ui, b)) b.appendChild(el("div", null, flattenText(a2ui) || "(no card content)"));
  }
  if (!b.childNodes.length) b.textContent = "(no response)";
  log.scrollTop = log.scrollHeight;
}

let mapInstance = null;
let mapMarkers = [];

async function openMapDrawer() {
  document.getElementById("mapDrawer").classList.add("open");
  document.getElementById("drawerOverlay").classList.add("open");

  if (!mapInstance) {
    // Center initially on SF Bay Area
    mapInstance = L.map("map").setView([37.82, -122.52], 10);
    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
      attribution: '&copy; OpenStreetMap contributors'
    }).addTo(mapInstance);
  }

  setTimeout(() => {
    mapInstance.invalidateSize();
  }, 350);

  // Fetch viewpoints from /api/viewpoints
  try {
    const res = await fetch("/api/viewpoints");
    const data = await res.json();
    const viewpoints = data.viewpoints || [];
    renderMapData(viewpoints);
  } catch (err) {
    console.error("Failed to load viewpoints:", err);
  }
}

function closeMapDrawer() {
  document.getElementById("mapDrawer").classList.remove("open");
  document.getElementById("drawerOverlay").classList.remove("open");
}

function renderMapData(viewpoints) {
  const listEl = document.getElementById("viewpointList");
  listEl.innerHTML = "";

  // Clear existing markers
  mapMarkers.forEach(m => mapInstance.removeLayer(m));
  mapMarkers = [];

  const group = [];

  viewpoints.forEach(vp => {
    // Create map marker
    const marker = L.marker([vp.lat, vp.lng]).addTo(mapInstance);
    marker.bindPopup(`
      <div style="font-family:sans-serif; max-width:220px;">
        <b style="font-size:1.05rem; color:#0f172a;">${vp.name}</b><br>
        <div style="font-size:0.85rem; color:#64748b; margin:0.3rem 0;">Elevation: <b>${vp.elevation_ft} ft</b></div>
        <div style="font-size:0.85rem; color:#0284c7; margin-bottom:0.4rem;">Optimal Inversion: ${vp.optimal_range}</div>
        <button onclick="quickAsk('What is the status of fog waves at ${vp.name.replace(/'/g, "\\'")}?'); closeMapDrawer();" style="width:100%; padding:0.35rem 0.6rem; background:#2563eb; color:#fff; border:none; border-radius:6px; cursor:pointer; font-weight:600; font-size:0.8rem;">Check Fog Waves</button>
      </div>
    `);
    mapMarkers.push(marker);
    group.push([vp.lat, vp.lng]);

    // Create list card in drawer
    const item = el("div", "map-viewpoint-item");
    item.innerHTML = `
      <div class="mv-name">${vp.name}</div>
      <div class="mv-meta">
        <span>📍 ${vp.region}</span>
        <span>⛰️ ${vp.elevation_ft} ft</span>
        <span class="mv-badge">${vp.rating}</span>
      </div>
      <div class="mv-desc">${vp.desc}</div>
      <div style="margin-top:0.5rem; font-size:0.82rem; color:#0284c7; font-weight:600;">
        Optimal Inversion: ${vp.optimal_range}
      </div>
    `;
    item.onclick = () => {
      mapInstance.setView([vp.lat, vp.lng], 13);
      marker.openPopup();
    };
    listEl.appendChild(item);
  });

  if (group.length > 0) {
    mapInstance.fitBounds(group, { padding: [30, 30] });
  }
}

function quickAsk(text) {
  input.value = text;
  form.dispatchEvent(new Event("submit"));
}

// The proxy returns { parts: [{kind:"text",text} | {kind:"a2ui",data}] }.
form.addEventListener("submit", async (ev) => {
  ev.preventDefault();
  const text = input.value.trim();
  if (!text) return;
  bubble("user").textContent = text;
  input.value = "";
  const b = bubble("agent"); b.textContent = "…";
  try {
    const res = await fetch("/chat", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ message: text }) });
    // Read as text first, then parse. If the proxy ever returns a non-JSON error
    // page (e.g. a plain "Internal Server Error"), show that body instead of a
    // cryptic "Unexpected token" JSON error.
    const raw = await res.text();
    let data;
    try { data = JSON.parse(raw); }
    catch { throw new Error(`Server returned non-JSON (HTTP ${res.status}). ${raw.slice(0, 300)}`); }
    renderReply(b, data.parts || []);
  } catch (e) {
    b.textContent = "Error: " + e.message;
  }
});
</script>
